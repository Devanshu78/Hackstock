version: "3.8"
services:
  redis:
    image: redis:7

  server:
    build: ./server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  client:
    build: ./client
    ports:
      - "5173:80"
    env_file:
      - ./client/.env
    depends_on:
      - server

  admin:
    build: ./admin
    ports:
      - "5174:80"
    env_file:
      - ./admin/.env
    depends_on:
      - server
